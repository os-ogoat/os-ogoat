<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="170"
  viewBox="0 0 900 170"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ex nihilo nihil fit.</title>
  <desc id="description">Nothing comes from nothing.</desc>
  <style>
    text {
      fill: #1f2328;
      font-family: Georgia, "Times New Roman", serif;
    }
    .panel {
      fill: #f6f8fa;
      stroke: #d0d7de;
      stroke-width: 1.5;
    }
    .quote {
      font-size: 29px;
      font-style: italic;
    }
    .translation {
      fill: #57606a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .mark {
      fill: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      text {
        fill: #f0f6fc;
      }
      .panel {
        fill: #161b22;
        stroke: #30363d;
      }
      .translation {
        fill: #8b949e;
      }
      .mark {
        fill: #58a6ff;
      }
    }
  </style>

  <rect class="panel" x="12" y="12" width="876" height="146" rx="24" />
  <circle class="mark" cx="376" cy="57" r="4" />
  <circle class="mark" cx="450" cy="57" r="4" />
  <circle class="mark" cx="524" cy="57" r="4" />
  <text class="quote" x="450" y="102" text-anchor="middle">
    Ex nihilo nihil fit.
  </text>
  <text class="translation" x="450" y="130" text-anchor="middle">
    Nothing comes from nothing
  </text>
</svg>
