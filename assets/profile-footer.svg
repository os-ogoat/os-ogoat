<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="330"
  viewBox="0 0 900 330"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ex nihilo nihil fit.</title>
  <desc id="description">
    The os-ogoat repository contains this profile. Diagram-design is a fork,
    with the original project and history belonging upstream. Ex nihilo nihil
    fit: nothing comes from nothing.
  </desc>
  <style>
    text {
      fill: #1f2328;
      font-family: Georgia, "Times New Roman", serif;
    }
    .panel {
      fill: #f6f8fa;
      stroke: #d0d7de;
      stroke-width: 1.5;
    }
    .quote {
      font-size: 29px;
      font-style: italic;
    }
    .eyebrow {
      fill: #0969da;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .card {
      fill: #ffffff;
      stroke: #d0d7de;
      stroke-width: 1.5;
    }
    .repo {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 19px;
      font-weight: 650;
    }
    .detail {
      fill: #57606a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    .translation {
      fill: #57606a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .mark {
      fill: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      text {
        fill: #f0f6fc;
      }
      .panel {
        fill: #161b22;
        stroke: #30363d;
      }
      .translation {
        fill: #8b949e;
      }
      .eyebrow {
        fill: #58a6ff;
      }
      .card {
        fill: #161b22;
        stroke: #30363d;
      }
      .detail {
        fill: #8b949e;
      }
      .mark {
        fill: #58a6ff;
      }
    }
  </style>

  <rect class="panel" x="12" y="12" width="876" height="306" rx="24" />
  <text class="eyebrow" x="48" y="54">THINGS ON GITHUB</text>

  <g transform="translate(48 76)">
    <rect class="card" width="384" height="92" rx="16" />
    <text class="repo" x="20" y="35">os-ogoat</text>
    <text class="detail" x="20" y="62">The source for this profile.</text>
  </g>
  <g transform="translate(468 76)">
    <rect class="card" width="384" height="92" rx="16" />
    <text class="repo" x="20" y="35">diagram-design</text>
    <text class="detail" x="20" y="61">
      <tspan x="20" dy="0">A fork; the original project and history</tspan>
      <tspan x="20" dy="19">remain with the upstream repository.</tspan>
    </text>
  </g>

  <circle class="mark" cx="376" cy="208" r="4" />
  <circle class="mark" cx="450" cy="208" r="4" />
  <circle class="mark" cx="524" cy="208" r="4" />
  <text class="quote" x="450" y="256" text-anchor="middle">
    Ex nihilo nihil fit.
  </text>
  <text class="translation" x="450" y="286" text-anchor="middle">
    Nothing comes from nothing
  </text>
</svg>
