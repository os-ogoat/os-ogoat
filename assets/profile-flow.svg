<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="210"
  viewBox="0 0 900 210"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">From curiosity to a beautiful finish</title>
  <desc id="description">
    A five-step process: explore, learn, collaborate, refine, and finish.
  </desc>
  <style>
    text {
      fill: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      fill: #ffffff;
      stroke: #d0d7de;
      stroke-width: 1.5;
    }
    .step {
      fill: #0969da;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .label {
      font-size: 18px;
      font-weight: 650;
    }
    .detail {
      fill: #57606a;
      font-size: 13px;
    }
    .connector {
      fill: none;
      stroke: #8c959f;
      stroke-linecap: round;
      stroke-width: 2;
    }
    @media (prefers-color-scheme: dark) {
      text {
        fill: #f0f6fc;
      }
      .card {
        fill: #161b22;
        stroke: #30363d;
      }
      .step {
        fill: #58a6ff;
      }
      .detail {
        fill: #8b949e;
      }
      .connector {
        stroke: #6e7681;
      }
    }
  </style>

  <text x="450" y="28" text-anchor="middle" class="label">
    How things become beautiful
  </text>

  <path class="connector" d="M166 113h20m-7-7 7 7-7 7" />
  <path class="connector" d="M340 113h20m-7-7 7 7-7 7" />
  <path class="connector" d="M514 113h20m-7-7 7 7-7 7" />
  <path class="connector" d="M688 113h20m-7-7 7 7-7 7" />

  <g transform="translate(12 58)">
    <rect class="card" width="154" height="110" rx="16" />
    <text class="step" x="18" y="29">01</text>
    <text class="label" x="18" y="59">Explore</text>
    <text class="detail" x="18" y="84">Start curious</text>
  </g>

  <g transform="translate(186 58)">
    <rect class="card" width="154" height="110" rx="16" />
    <text class="step" x="18" y="29">02</text>
    <text class="label" x="18" y="59">Learn</text>
    <text class="detail" x="18" y="84">Test the idea</text>
  </g>

  <g transform="translate(360 58)">
    <rect class="card" width="154" height="110" rx="16" />
    <text class="step" x="18" y="29">03</text>
    <text class="label" x="18" y="59">Collaborate</text>
    <text class="detail" x="18" y="84">Share the standard</text>
  </g>

  <g transform="translate(534 58)">
    <rect class="card" width="154" height="110" rx="16" />
    <text class="step" x="18" y="29">04</text>
    <text class="label" x="18" y="59">Refine</text>
    <text class="detail" x="18" y="84">Make choices count</text>
  </g>

  <g transform="translate(708 58)">
    <rect class="card" width="154" height="110" rx="16" />
    <text class="step" x="18" y="29">05</text>
    <text class="label" x="18" y="59">Finish</text>
    <text class="detail" x="18" y="84">Know when it is done</text>
  </g>
</svg>
